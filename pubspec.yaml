name: noor_quran
description: "A new Flutter project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0

  go_router: ^17.2.3

  get_it: ^9.2.1

  sqflite: ^2.3.0
  path_provider: ^2.1.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  dio: ^5.4.0
  internet_connection_checker: ^3.0.1

  just_audio: ^0.10.5
  audio_service: ^0.18.12
  just_audio_background: ^0.0.1-beta.7

  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  google_generative_ai: ^0.4.7

  connectivity_plus: ^6.1.5
  url_launcher: ^6.2.1
  share_plus: ^13.1.0
  flutter_slidable: ^4.0.3
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.1

flutter_native_splash:
  # ◄◄◄ الخلفية نفس لون التطبيق
  color: "#f8f3e8"

  # ◄◄◄ الصورة الرئيسية (1152x1152)
  image: assets/images/splash_logo.png

  # ◄◄◄ branding للـ Android 12+ (يظهر تحت الأيقونة)
  branding: assets/images/branding.png

  # ◄◄◄ Android 12+ specific
  android_12:
    image: assets/images/splash_logo.png
    icon_background_color: "#1a472a"
    branding: assets/images/branding.png

  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/json/quran/tafsir.json
    - assets/json/hadith/hadith_en.json
    - assets/json/azkar/azkar.json
    - assets/icons/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf

    - family: Uthmanic
      fonts:
        - asset: assets/fonts/Uthmanic.ttf